version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: ruach_db
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  localstack:
    image: localstack/localstack
    environment:
      - SERVICES=s3
      - DEBUG=1
    ports:
      - '4566:4566'

volumes:
  db-data:
